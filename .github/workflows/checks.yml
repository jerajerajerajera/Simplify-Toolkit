name: Checks
on:
  push:
    branches: [main]
  pull_request: {}
jobs:
  # A change to text only (docs, Markdown) skips the panel: tests and pint still run, so the check stays green.
  changes:
    runs-on: ubuntu-latest
    outputs:
      code: ${{ steps.diff.outputs.code }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - id: diff
        run: |
          case "${{ github.event_name }}" in
            pull_request) base="origin/${{ github.base_ref }}" ;;
            push) base="${{ github.event.before }}" ;;
            *) echo "code=true" >> "$GITHUB_OUTPUT"; exit 0 ;;
          esac
          files=$(git diff --name-only "$base" HEAD 2>/dev/null) || files=unknown
          printf 'Changed:\n%s\n' "$files"
          if printf '%s\n' "$files" | grep -qvE '^(docs/|LICENSE|.*\.md$)'; then echo "code=true" >> "$GITHUB_OUTPUT"; else echo "code=false" >> "$GITHUB_OUTPUT"; echo "::notice::Text only: the panel smoke is skipped"; fi
  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
      - run: bash tests/run.sh
      - run: bash tests/docs-sync.sh
  pint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          tools: pint
      - run: pint --test
  # Installs the plugin in a real Pelican panel and opens its pages, so an error that only shows when the panel loads the code blocks the merge.
  panel-smoke:
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - pelican: '1.0.0-beta38'
            php: '8.3'
          - pelican: '1.0.0-rc.2'
            php: '8.4'
          # With the real Simplify core (main), not a stub: the add-on opens inside Simplify (P-1).
          - pelican: '1.0.0-rc.2'
            php: '8.4'
            simplify: 'main'
    name: panel-smoke (Pelican ${{ matrix.pelican }}${{ matrix.simplify && format(', Simplify {0}', matrix.simplify) || '' }})
    steps:
      - uses: actions/checkout@v7
        with:
          path: plugin
      - uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          extensions: bcmath, gd, intl, mbstring, pdo_sqlite, sqlite3, zip
          tools: composer
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
      - run: npm install -g yarn
      - name: Install Pelican ${{ matrix.pelican }}
        run: |
          git clone --quiet --depth 1 --branch "v${{ matrix.pelican }}" https://github.com/pelican-dev/panel.git panel
          cd panel
          composer install --no-interaction --no-progress --prefer-dist
          sed -i "s/'version' => 'canary'/'version' => '${{ matrix.pelican }}'/" config/app.php
          cp .env.example .env
          sed -i 's/^APP_INSTALLED=.*/APP_INSTALLED=true/; s/^APP_DEBUG=.*/APP_DEBUG=true/; s#^APP_URL=.*#APP_URL=http://localhost#' .env
          printf 'DB_CONNECTION=sqlite\nQUEUE_CONNECTION=database\nCACHE_STORE=file\nSESSION_DRIVER=file\nMAIL_MAILER=log\n' >> .env
          touch database/database.sqlite
          php artisan key:generate --force
          php artisan migrate --force
          yarn install --silent
      - name: Install Simplify ${{ matrix.simplify }}
        if: matrix.simplify
        run: |
          git clone --quiet --depth 1 --branch "${{ matrix.simplify }}" https://github.com/jerajerajerajera/simplify.git panel/plugins/simplify
          rm -rf panel/plugins/simplify/.git
          cd panel
          php artisan p:plugin:install simplify
          php artisan p:plugin:list | grep -E '\| Simplify .*\| enabled' || { echo 'Simplify did not install'; exit 1; }
      - name: Install Simplify Toolkit
        run: |
          mkdir -p panel/plugins/simplify-toolkit
          tar -C plugin --exclude=.git --exclude=dist -cf - . | tar -C panel/plugins/simplify-toolkit -xf -
          cd panel
          php plugins/simplify-toolkit/tests/panel/takeover.php before
          php artisan p:plugin:install simplify-toolkit
          php plugins/simplify-toolkit/tests/panel/takeover.php after
          php artisan p:plugin:list | tee plugins.txt
          grep -E 'Simplify Toolkit .*\| enabled' plugins.txt || { echo 'Simplify Toolkit did not install'; exit 1; }
      - name: Open the pages
        working-directory: panel
        # The output is checked as well as the exit code: a crash during Laravel's bootstrap can still exit with 0.
        run: |
          php plugins/simplify-toolkit/tests/panel/smoke.php | tee smoke.txt
          grep -q '^All steps passed$' smoke.txt
      - name: PHPStan (level 5, in the panel)
        if: matrix.simplify == 'main' # the add-on's classes extend the core's
        working-directory: panel
        # After the smoke: installing larastan brings PHPUnit into the panel, which changes how Livewire's test helpers behave.
        run: |
          composer require --dev larastan/larastan --no-interaction --no-progress --quiet
          # Without a baseline yet: the first run writes one and prints it, to commit as the starting point (every
          # finding in it is on the clean-up list; new code must be clean).
          if [ -f plugins/simplify-toolkit/phpstan-baseline.neon ]; then
            vendor/bin/phpstan analyse --configuration plugins/simplify-toolkit/phpstan.neon --memory-limit 1G --no-progress --error-format=github
          else
            vendor/bin/phpstan analyse --configuration plugins/simplify-toolkit/phpstan.neon --memory-limit 1G --no-progress --generate-baseline=plugins/simplify-toolkit/phpstan-baseline.neon --allow-empty-baseline
            echo '::group::phpstan-baseline.neon'; cat plugins/simplify-toolkit/phpstan-baseline.neon; echo '::endgroup::'
          fi
      - name: Laravel log
        if: failure()
        run: grep -h -E '^\[[0-9-]+ [0-9:]+\]' panel/storage/logs/*.log | cut -c1-600 | tail -n 12 || true
  # The way panels get this version: from the oldest release on the Hub (1.3.1) with every setting filled in, then
  # removed and installed again (the data stays), and the previous release put back over it.
  upgrade:
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
        with:
          path: plugin
          fetch-depth: 0
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          extensions: bcmath, gd, intl, mbstring, pdo_sqlite, sqlite3, zip
          tools: composer
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
      - run: npm install -g yarn
      - name: Install Pelican 1.0.0-rc.2
        run: |
          git clone --quiet --depth 1 --branch v1.0.0-rc.2 https://github.com/pelican-dev/panel.git panel
          cd panel
          composer install --no-interaction --no-progress --prefer-dist
          sed -i "s/'version' => 'canary'/'version' => '1.0.0-rc.2'/" config/app.php
          cp .env.example .env
          sed -i 's/^APP_INSTALLED=.*/APP_INSTALLED=true/; s/^APP_DEBUG=.*/APP_DEBUG=true/; s#^APP_URL=.*#APP_URL=http://localhost#' .env
          printf 'DB_CONNECTION=sqlite\nQUEUE_CONNECTION=database\nCACHE_STORE=file\nSESSION_DRIVER=file\nMAIL_MAILER=log\n' >> .env
          touch database/database.sqlite
          php artisan key:generate --force
          php artisan migrate --force
          yarn install --silent
      - name: Install Simplify Toolkit 1.3.1 with its settings filled in
        run: |
          mkdir -p panel/plugins/simplify-toolkit
          git -C plugin archive v1.3.1 | tar -C panel/plugins/simplify-toolkit -xf -
          cd panel
          php artisan p:plugin:install simplify-toolkit
          php ../plugin/tests/panel/upgrade.php fill
      - name: Install this version over it
        run: |
          rm -rf panel/plugins/simplify-toolkit && mkdir -p panel/plugins/simplify-toolkit
          tar -C plugin --exclude=.git --exclude=dist -cf - . | tar -C panel/plugins/simplify-toolkit -xf -
          cd panel
          # As Admin → Plugins and the Hub install it: in a queue job.
          php artisan tinker --execute="App\Jobs\Plugin\InstallPlugin::dispatch(App\Models\User::factory()->create(), 'simplify-toolkit');"
          php artisan queue:work --max-jobs=1 --stop-when-empty
          php artisan p:plugin:list | grep -E 'Simplify Toolkit .*\| enabled' || { echo 'Simplify Toolkit did not install'; exit 1; }
          php ../plugin/tests/panel/upgrade.php check
          php ../plugin/tests/panel/upgrade.php open
      - name: Remove it and install it again
        working-directory: panel
        run: |
          php artisan tinker --execute="app(App\Services\Helpers\PluginService::class)->uninstallPlugin(App\Models\Plugin::findOrFail('simplify-toolkit'));"
          php ../plugin/tests/panel/upgrade.php gone
          php artisan p:plugin:install simplify-toolkit
          php ../plugin/tests/panel/upgrade.php kept
          php ../plugin/tests/panel/upgrade.php open
      - name: Put the previous release back over it
        run: |
          previous="$(git -C plugin tag --list 'v*' --sort=-v:refname | head -n 1)"
          echo "Previous release: $previous"
          rm -rf panel/plugins/simplify-toolkit && mkdir -p panel/plugins/simplify-toolkit
          git -C plugin archive "$previous" | tar -C panel/plugins/simplify-toolkit -xf -
          cd panel
          php artisan p:plugin:install simplify-toolkit
          php ../plugin/tests/panel/upgrade.php check
          php ../plugin/tests/panel/upgrade.php open
      - name: Laravel log
        if: failure()
        run: grep -h -E '^\[[0-9-]+ [0-9:]+\]' panel/storage/logs/*.log | cut -c1-600 | tail -n 12 || true
